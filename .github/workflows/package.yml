# Reusable macOS packaging for issue #92. A complete five-secret credential
# set produces Developer ID signed, notarized artifacts. No credentials produce
# explicitly labeled unsigned-dev artifacts; any partial set fails closed.
name: Package macOS

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact branch, tag, or SHA to package (defaults to the triggering ref)
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      ref:
        description: Exact branch, tag, or SHA to package
        required: false
        type: string
        default: ''
    secrets:
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false
      APPLE_API_KEY:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false
    outputs:
      signing_mode:
        description: signed or unsigned-dev
        value: ${{ jobs.package.outputs.signing_mode }}
      artifact_name:
        description: Uploaded macOS artifact name
        value: ${{ jobs.package.outputs.artifact_name }}

permissions:
  actions: read
  contents: read

jobs:
  policy:
    name: Action Policy
    if: github.event_name != 'workflow_call'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authorize direct workflow event
        uses: qwts/qwts-agent-ci/.github/actions/ci-policy@3a5617b287d922e37f262210a1d8750d8217b56d
        with:
          authorization-only: 'true'

  evidence:
    name: Verify exact CI evidence
    needs: policy
    if: always() && (github.event_name == 'workflow_call' || needs.policy.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - id: commit
        name: Resolve immutable package commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require successful complete-suite evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          queue_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=merge_group&head_sha=$PACKAGE_SHA&per_page=100" \
            --jq 'first(.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .conclusion == "success") | .id) // empty')
          complete=false
          if [ -n "$queue_run" ]; then
            complete=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$queue_run/jobs?filter=latest&per_page=100" \
              --jq 'any(.jobs[]; .name == "CI" and .conclusion == "success")')
          else
            push_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=push&head_sha=$PACKAGE_SHA&per_page=100" \
              --jq 'first(.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .conclusion == "success") | .id) // empty')
            if [ -n "$push_run" ]; then
              complete=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$push_run/jobs?filter=latest&per_page=100" \
                --jq 'any(.jobs[]; .name == "Complete suite" and .conclusion == "success")')
            else
              manual_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=workflow_dispatch&head_sha=$PACKAGE_SHA&per_page=100" \
                --jq 'first(.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .conclusion == "success") | .id) // empty')
              if [ -n "$manual_run" ]; then
                complete=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$manual_run/jobs?filter=latest&per_page=100" \
                  --jq 'any(.jobs[]; .name == "Complete suite" and .conclusion == "success")')
              fi
            fi
          fi
          test "$complete" = true

  package:
    name: macOS universal bundle
    needs: evidence
    runs-on: macos-latest
    timeout-minutes: 90
    outputs:
      signing_mode: ${{ steps.signing.outputs.mode }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
    steps:
      - name: Checkout exact validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.evidence.outputs.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Install locked root dependencies
        uses: qwts/qwts-agent-ci/.github/actions/bounded-command@3a5617b287d922e37f262210a1d8750d8217b56d
        with:
          task: Install locked root dependencies
          executable: npm
          arguments-json: '["ci"]'
          timeout-seconds: '600'
          attempts: '2'
          retry-delay-seconds: '5'

      - name: Install locked UI dependencies
        uses: qwts/qwts-agent-ci/.github/actions/bounded-command@3a5617b287d922e37f262210a1d8750d8217b56d
        with:
          task: Install locked UI dependencies
          executable: npm
          arguments-json: '["ci"]'
          working-directory: ui
          timeout-seconds: '600'
          attempts: '2'
          retry-delay-seconds: '5'

      - name: Install universal Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # Regenerate THIRD-PARTY-NOTICES in the actual shipping environment (#222).
      # Running here — on the macOS runner, before the UI build — means the
      # in-app Acknowledgements view and the shipped notices file always reflect
      # the exact apple-target dependency graph that ships, with no reliance on a
      # possibly-stale committed copy.
      - name: Install cargo-about
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: cargo-about@0.9.1

      - name: Generate third-party notices
        run: |
          cargo fetch --locked
          node scripts/generate-notices.mjs

      - name: Select signing mode
        id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node scripts/signing-secrets.mjs >> "$GITHUB_OUTPUT"

      # Compile with no signing material in the environment (#480). Cargo runs
      # every crate's build script and proc macro and expands env!/option_env!,
      # so any secret visible here could be embedded in the shipped binary
      # (e.g. `include_str!(env!("APPLE_API_KEY_PATH"))`). Compilation is split
      # from bundling: `tauri build --no-bundle` compiles and lipos the
      # universal binary; `tauri bundle` below only packages, signs, and
      # notarizes it (tauri-cli 2.11.4 runs no Cargo compilation there, only
      # `cargo metadata`). The App Store Connect key is decoded only after this
      # step and is passed as a step output, never through $GITHUB_ENV, so the
      # key file does not exist and no APPLE_* variable is set while compiling.
      #
      # dSYM archival (#249): rustc's `-C strip=symbols` (from the workspace
      # release profile) strips at link time — on Apple targets rustc does
      # this by shelling out to the platform `strip` tool after linking, not
      # by passing a linker flag. There is only ONE link here: this compiles
      # the universal binary once with debug info and no cargo-level
      # stripping (profile overrides via env, no Cargo.toml change, so every
      # other release build of this workspace keeps #221's stripped-by-default
      # hardening), runs `dsymutil` against it to capture the `.dSYM` from its
      # debug map, then strips that SAME binary in place with `strip` —
      # exactly what `-C strip=symbols` would have done at link time, and
      # exactly Xcode's own "Generate dSYM / Strip Linked Product" pipeline.
      #
      # This must NOT be a second `cargo`/`tauri` compile: symbolication
      # matches each architecture slice's dSYM to the shipped binary by
      # Mach-O LC_UUID, and a second link generates a new UUID per slice,
      # silently breaking that match even though the artifact name and
      # contents look right (PR #523 review). `strip`, unlike a relink, only
      # removes the symbol table — it does not touch LC_UUID — so the
      # in-place strip below keeps the shipped binary's UUID identical to the
      # one dsymutil already captured. That match is asserted explicitly
      # with `dwarfdump --uuid` before bundling continues.
      - name: Compile universal binary without signing secrets
        run: |
          set -euo pipefail
          export CARGO_PROFILE_RELEASE_STRIP=none
          export CARGO_PROFILE_RELEASE_DEBUG=true
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY \
            APPLE_API_KEY_PATH APPLE_API_ISSUER APPLE_SIGNING_IDENTITY \
            CSC_LINK CSC_KEY_PASSWORD; do
            if [ -n "${!name:-}" ]; then
              echo "::error::$name must not be set while compiling"
              exit 1
            fi
          done
          npm run package:macos:compile

      - name: Extract dSYM from the debug build
        id: dsym
        run: |
          set -euo pipefail
          bin="target/universal-apple-darwin/release/app"
          test -f "$bin"
          mkdir -p dsyms
          dsymutil "$bin" -o "dsyms/Cartograph.dSYM"
          test -d "dsyms/Cartograph.dSYM"
          echo "path=dsyms/Cartograph.dSYM" >> "$GITHUB_OUTPUT"

      - name: Strip debug info from binary (preserving dSYM UUID)
        run: |
          set -euo pipefail
          bin="target/universal-apple-darwin/release/app"
          test -f "$bin"
          strip "$bin"

      - name: Verify dSYM UUID matches the binary to be bundled
        run: |
          set -euo pipefail
          bin="target/universal-apple-darwin/release/app"
          dsym="${{ steps.dsym.outputs.path }}"
          bin_uuids=$(dwarfdump --uuid "$bin" | awk '{print $2, $3}' | sort)
          dsym_uuids=$(dwarfdump --uuid "$dsym" | awk '{print $2, $3}' | sort)
          echo "binary UUID(s):"
          printf '%s\n' "$bin_uuids"
          echo "dSYM UUID(s):"
          printf '%s\n' "$dsym_uuids"
          if [ -z "$bin_uuids" ] || [ "$bin_uuids" != "$dsym_uuids" ]; then
            echo "::error::dSYM UUID(s) do not match the binary that will be bundled; crash report symbolication would fail"
            exit 1
          fi

      - name: Decode App Store Connect key
        id: apple_key
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          umask 077
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_B64" | openssl base64 -d -A -out "$key_path"
          test -s "$key_path"
          echo "key_path=$key_path" >> "$GITHUB_OUTPUT"

      - name: Bundle, sign, and notarize universal app
        if: steps.signing.outputs.signed == 'true'
        env:
          # Map the established Photos secret names to Tauri's documented inputs.
          APPLE_CERTIFICATE: ${{ secrets.CSC_LINK }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ steps.apple_key.outputs.key_path }}
        run: npm run package:macos:bundle

      - name: Bundle ad-hoc signed unsigned-dev universal app
        if: steps.signing.outputs.signed == 'false'
        env:
          # Apple Silicon requires a signature; '-' is Tauri's ad-hoc identity.
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run package:macos:bundle

      - name: Locate bundles
        id: bundles
        run: |
          set -euo pipefail
          app="target/universal-apple-darwin/release/bundle/macos/Cartograph.app"
          dmg=$(find target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          test -d "$app"
          test -n "$dmg"
          test -f "$dmg"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"

      - name: Notarize and staple disk image
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ steps.apple_key.outputs.key_path }}
        run: |
          set -euo pipefail
          dmg="${{ steps.bundles.outputs.dmg }}"
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg"

      - name: Verify Developer ID signature, Gatekeeper, and notarization
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "${{ steps.bundles.outputs.app }}"
          codesign --verify --strict --verbose=2 "${{ steps.bundles.outputs.dmg }}"
          spctl --assess --type execute --verbose=2 "${{ steps.bundles.outputs.app }}"
          spctl --assess --type open --context context:primary-signature --verbose=2 "${{ steps.bundles.outputs.dmg }}"
          xcrun stapler validate "${{ steps.bundles.outputs.app }}"
          xcrun stapler validate "${{ steps.bundles.outputs.dmg }}"

      - name: Verify unsigned-dev boundary
        if: steps.signing.outputs.signed == 'false'
        run: |
          set -euo pipefail
          app="${{ steps.bundles.outputs.app }}"
          codesign --verify --deep --strict --verbose=2 "$app"
          details=$(codesign --display --verbose=4 "$app" 2>&1)
          if printf '%s\n' "$details" | grep -Eq '^Authority=|Developer ID Application'; then
            echo '::error::unsigned-dev bundle unexpectedly has a trusted signing authority'
            exit 1
          fi

      - name: Stage stable versioned artifacts
        id: metadata
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          APP_PATH: ${{ steps.bundles.outputs.app }}
          DMG_PATH: ${{ steps.bundles.outputs.dmg }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          artifact_name="cartograph-${version}-macos-universal-${SIGNING_MODE}"
          mkdir -p dist
          cp "$DMG_PATH" "dist/Cartograph_${version}_universal_${SIGNING_MODE}.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" \
            "dist/Cartograph_${version}_universal_${SIGNING_MODE}.app.zip"
          # Note: LICENSE + THIRD-PARTY-NOTICES are NOT staged into dist/ — the
          # release-publish job asserts dist/ holds exactly the .app.zip + .dmg.
          # The notices ship inside the .app itself (Settings › About & licenses
          # embeds the freshly-generated notices), so they travel with both
          # artifacts without breaking that check.
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload versioned artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      # Internal artifact (#249), not a release asset: kept separate from
      # dist/ so it never affects the release-publish job's "dist/ holds
      # exactly the .app.zip + .dmg" assertion above. Symbolicates crash
      # reports (.ips) and `sample`/`atos` profiles against this exact build
      # with `dsymutil -s Cartograph.dSYM` / `atos -o Cartograph.dSYM ...`.
      - name: Upload dSYM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}-dSYM
          path: ${{ steps.dsym.outputs.path }}
          if-no-files-found: error
          retention-days: 90
