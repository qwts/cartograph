# Version updates (security updates are enabled repo-side already).
# Weekly, grouped minor+patch so bumps arrive as one gated PR per ecosystem.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-root-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    groups:
      npm-ui-minor-patch:
        update-types: [minor, patch]
    ignore:
      # TS 7.x is blocked until typescript-eslint's peer range admits it (#174).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Cytoscape 3.34.1 dropped its npm provenance attestation (3.34.0 has
      # one); held until a later release restores provenance or the
      # regression is explicitly accepted (#328).
      - dependency-name: cytoscape
        versions: ["3.34.1"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      codeql-action:
        patterns:
          - github/codeql-action/*
