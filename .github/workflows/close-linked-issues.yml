name: Close linked issues

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  policy:
    name: Action Policy
    runs-on: ubuntu-latest
    steps:
      - name: Authorize direct workflow event
        uses: qwts/playbook-engineering/.github/actions/ci-policy@060c1fae87a9297f6480a9fdd3a4e7741bb92e80
        with:
          authorization-only: 'true'

  close-linked-issues:
    name: Close linked issues
    needs: policy
    # Keep in sync with TARGET_BASE_REFS in scripts/close-linked-issues.mjs.
    if: |
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Close issues referenced by merged PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/close-linked-issues.mjs
