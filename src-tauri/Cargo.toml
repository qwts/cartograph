[package]
name = "app"
description = "Tauri shell: commands, job orchestration, UI event bus (SPEC-00 §8.1)"
version.workspace = true
edition.workspace = true
publish.workspace = true
license-file.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Already in the dependency graph via tauri/wry; canonicalize without the
# Windows \\?\ verbatim prefix at the storage boundary (#225).
dunce = "1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
core-graph = { workspace = true }
core-prov = { workspace = true }
source-capture = { workspace = true }
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
context-hub = { workspace = true }
adapters-lang-ts = { workspace = true }
adapters-plugin-host = { workspace = true }
adapters-lang-python = { workspace = true }
adapters-lang-go = { workspace = true }
adapters-lang-java = { workspace = true }
adapters-lang-kotlin = { workspace = true }
dynamic = { workspace = true }
iac = { workspace = true }
events = { workspace = true }
flowtracer = { workspace = true }
ingest = { workspace = true }
spec = { workspace = true }
llm = { workspace = true }
semantic = { workspace = true }
agents = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Handle-based filesystem capability checks for durable execution storage.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
core-graph = { workspace = true, features = ["test-support"] }
tempfile = "3"
tauri = { version = "2", features = ["test"] }
