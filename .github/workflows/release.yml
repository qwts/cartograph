# Tag-driven, idempotent GitHub Release publication for issue #93. The exact
# tag is validated before the reusable macOS packaging workflow is allowed to
# produce the only assets this workflow publishes.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated vX.Y.Z tag to recover or republish
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  policy:
    name: Action Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authorize direct workflow event
        uses: qwts/playbook-engineering/.github/actions/ci-policy@df404e2ce63fc1566eb2a60c92a8fabe009955b0
        with:
          authorization-only: 'true'

  validate:
    name: Validate reviewed release tag
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Validate tag, version, and reviewed cut
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          npm run version:check
          expected=$(node scripts/release-version.mjs tag)
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Requested tag $TAG does not match synchronized version tag $expected."
            exit 1
          fi
          if [ "$(git cat-file -t "refs/tags/$TAG")" != 'tag' ]; then
            echo "::error::$TAG must be an annotated tag."
            exit 1
          fi

          tag_commit=$(git rev-list -n 1 "$TAG")
          if [ "$(git rev-parse HEAD)" != "$tag_commit" ]; then
            echo "::error::Checkout is not the commit referenced by $TAG."
            exit 1
          fi
          pending=$(node scripts/release-version.mjs pending)
          if [ -n "$pending" ]; then
            echo "::error::$TAG still contains pending Changesets: $pending"
            exit 1
          fi

          version_pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag_commit/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main" and .head.ref == "changeset-release/main")] | first | .number // empty')
          if [ -z "$version_pr" ]; then
            echo "::error::$TAG is not a merged changeset-release/main Version packages PR."
            exit 1
          fi

          git fetch origin main
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "::error::$TAG does not resolve to a commit on main."
            exit 1
          fi

          # Prefer complete merge-group evidence for this exact commit. Until
          # the required queue is enabled, a rewritten main SHA must have run
          # the complete fallback rather than borrowing a tree-equivalent run.
          queue_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=merge_group&head_sha=$tag_commit&per_page=100" \
            --jq 'first(.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .conclusion == "success") | .id) // empty')
          complete=false
          if [ -n "$queue_run" ]; then
            complete=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$queue_run/jobs?filter=latest&per_page=100" \
              --jq 'any(.jobs[]; .name == "CI" and .conclusion == "success")')
          else
            push_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=push&head_sha=$tag_commit&per_page=100" \
              --jq 'first(.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .conclusion == "success") | .id) // empty')
            if [ -n "$push_run" ]; then
              complete=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$push_run/jobs?filter=latest&per_page=100" \
                --jq 'any(.jobs[]; .name == "Complete suite" and .conclusion == "success")')
            fi
          fi
          if [ "$complete" != true ]; then
            echo "::error::$tag_commit lacks successful exact-commit complete-suite evidence."
            exit 1
          fi

          approved=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$version_pr/reviews?per_page=100" \
            --jq 'any(.[]; .state == "APPROVED")')
          if [ "$approved" != true ]; then
            echo "::error::Version packages PR #$version_pr lacks an approval."
            exit 1
          fi
          pr_head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$version_pr" --jq '.head.sha')
          pr_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&head_sha=$pr_head&per_page=100" \
            --jq 'first(.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .conclusion == "success") | .id) // empty')
          if [ -z "$pr_run" ]; then
            echo "::error::Version packages PR #$version_pr lacks ready-PR CI for exact head $pr_head."
            exit 1
          fi
          verified=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$pr_run/jobs?filter=latest&per_page=100" \
            --jq 'any(.jobs[]; .name == "CI" and .conclusion == "success")')
          if [ "$verified" != true ]; then
            echo "::error::Version packages PR #$version_pr lacks a successful stable CI gate."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Validated $TAG at reviewed Version packages PR #$version_pr."

  build:
    name: Build exact release tag
    needs: validate
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ needs.validate.outputs.tag }}
    secrets: inherit

  publish:
    name: Publish GitHub Release
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    env:
      SIGNING_MODE: ${{ needs.build.outputs.signing_mode }}
      TAG: ${{ needs.validate.outputs.tag }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Checkout exact tag for changelog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Download this run's exact package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      - name: Validate release assets and metadata
        id: publication
        run: |
          set -euo pipefail
          node scripts/release-metadata.mjs metadata "$TAG" "$SIGNING_MODE" >> "$GITHUB_OUTPUT"

          expected_app="Cartograph_${VERSION}_universal_${SIGNING_MODE}.app.zip"
          expected_dmg="Cartograph_${VERSION}_universal_${SIGNING_MODE}.dmg"
          mapfile -t assets < <(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "${#assets[@]}" -ne 2 ] \
            || [ "${assets[0]}" != "$expected_app" ] \
            || [ "${assets[1]}" != "$expected_dmg" ]; then
            printf '::error::Expected only %s and %s; found: %s\n' \
              "$expected_app" "$expected_dmg" "${assets[*]}"
            exit 1
          fi

          if [ "$SIGNING_MODE" = 'unsigned-dev' ]; then
            {
              printf '> [!WARNING]\n'
              printf '> Unsigned development build: not a production release and not trusted by Gatekeeper.\n\n'
              node scripts/release-metadata.mjs notes "$VERSION" CHANGELOG.md
            } > release-notes.md
          else
            node scripts/release-metadata.mjs notes "$VERSION" CHANGELOG.md > release-notes.md
          fi

      - name: Require chores-dumb credentials
        run: test "${{ secrets.CHORES_DUMB_CLIENT_ID != '' && secrets.CHORES_DUMB_PRIVATE_KEY != '' }}" = true

      - name: Mint the chores-dumb token
        id: chores
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CHORES_DUMB_CLIENT_ID }}
          private-key: ${{ secrets.CHORES_DUMB_PRIVATE_KEY }}

      - name: Create or update release without duplicate assets
        env:
          GH_TOKEN: ${{ steps.chores.outputs.token }}
          PRERELEASE: ${{ steps.publication.outputs.prerelease }}
          RELEASE_TITLE: ${{ steps.publication.outputs.title }}
        run: |
          set -euo pipefail

          if [ "$SIGNING_MODE" = 'signed' ]; then
            stale_mode='unsigned-dev'
            latest='true'
          else
            stale_mode='signed'
            latest='false'
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --verify-tag \
              --draft=false \
              --prerelease="$PRERELEASE" \
              --latest="$latest" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md

            for extension in app.zip dmg; do
              stale_asset="Cartograph_${VERSION}_universal_${stale_mode}.${extension}"
              if gh release view "$TAG" --json assets \
                --jq ".assets[].name | select(. == \"$stale_asset\")" | grep -q .; then
                gh release delete-asset "$TAG" "$stale_asset" --yes
              fi
            done
            gh release upload "$TAG" dist/* --clobber
          elif [ "$SIGNING_MODE" = 'signed' ]; then
            gh release create "$TAG" dist/* \
              --verify-tag \
              --latest \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" dist/* \
              --verify-tag \
              --prerelease \
              --latest=false \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md
          fi
